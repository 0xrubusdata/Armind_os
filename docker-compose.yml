  #   networks:
  #     - armindos-network  

  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    restart: always
    ports:
      - "${PORTAINER_PORT}:${PORTAINER_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data  
    networks:
      - armindos-network    

volumes:
  posgre_data:
    driver: local
  portainer_data:
    driver: local

networks:
  armindos-network:
    driver: bridge  